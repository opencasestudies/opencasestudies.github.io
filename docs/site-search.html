<script>
  document.addEventListener('DOMContentLoaded', function () {
    /* ── Floating toolbar (translate) ── */
    var toolbar = document.createElement('div');
    toolbar.id = 'ocs-toolbar';

    var translateSlot = document.createElement('div');
    translateSlot.id = 'google_translate_element';
    toolbar.appendChild(translateSlot);

    document.body.appendChild(toolbar);

    /* ── Inline navbar search ── */
    var searchLink = document.querySelector('.navbar-nav a[href="site-search.html"]');
    var navbarCollapse = document.querySelector('.navbar-collapse');
    if (!searchLink || !navbarCollapse) return;

    // Replace placeholder text with the FA icon
    searchLink.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i>';
    searchLink.setAttribute('title', 'Search');

    // Build Bootstrap 3 navbar-form and append to navbar
    var form = document.createElement('form');
    form.id = 'ocs-inline-search';
    form.className = 'navbar-form navbar-right';
    form.setAttribute('role', 'search');
    form.style.display = 'none';
    form.innerHTML =
      '<div class="input-group">' +
        '<input id="ocs-search-q" type="text" class="form-control"' +
        '  placeholder="Search site\u2026" autocomplete="off">' +
        '<span class="input-group-btn">' +
          '<button class="btn" type="submit">' +
            '<i class="fa fa-search"></i>' +
          '</button>' +
        '</span>' +
      '</div>';
    navbarCollapse.appendChild(form);

    // Toggle form on search icon click
    searchLink.addEventListener('click', function (e) {
      e.preventDefault();
      var isOpen = form.style.display !== 'none';
      form.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) document.getElementById('ocs-search-q').focus();
    });

    // Submit → redirect to site-search.html with GCSE hash
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var q = document.getElementById('ocs-search-q').value.trim();
      if (q) window.location.href = 'site-search.html?q=' + encodeURIComponent(q);
    });

    // Close when clicking outside
    document.addEventListener('click', function (e) {
      if (!form.contains(e.target) && !searchLink.contains(e.target)) {
        form.style.display = 'none';
      }
    });
  });
</script>

// manage active state of menu based on current page
$(document).ready(function () {
  // active menu anchor
  href = window.location.pathname
  href = href.substr(href.lastIndexOf('/') + 1)
  if (href === "")
    href = "index.html";
  var menuAnchor = $('a[href="' + href + '"]');

  // mark the anchor link active (and if it's in a dropdown, also mark that active)
  var dropdown = menuAnchor.closest('li.dropdown');
  if (window.bootstrap) { // Bootstrap 4+
    menuAnchor.addClass('active');
    dropdown.find('> .dropdown-toggle').addClass('active');
  } else { // Bootstrap 3
    menuAnchor.parent().addClass('active');
    dropdown.addClass('active');

  // Navbar adjustments

<div class="search-wrapper">
  <div class="gcse-search"></div>
</div>

<script>
// If ?q= is in the URL, wait for GCSE to render then auto-submit the search
(function () {
  var q = new URLSearchParams(window.location.search).get('q');
  if (!q) return;

  var attempts = 0;
  var iv = setInterval(function () {
    var input = document.querySelector('input.gsc-input');
    var btn   = document.querySelector('button.gsc-search-button');
    if (input && btn) {
      input.value = q;
      btn.click();
      clearInterval(iv);
    }
    if (++attempts > 50) clearInterval(iv); // give up after 5s
  }, 100);
})();
</script>
