<style>
/* ── Floating toolbar ── */
#ocs-toolbar {
  position: fixed;
  top: 12px;
  right: 16px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.95);
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 4px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  backdrop-filter: blur(4px);
}
#ocs-toolbar .goog-te-gadget-simple {
  border: none !important;
  background: transparent !important;
  font-size: 1rem !important;
  padding: 0 !important;
  white-space: nowrap;
}
#ocs-toolbar .goog-te-gadget-simple img { display: none !important; }
#ocs-toolbar .goog-te-gadget-simple .goog-te-menu-value {
  font-size: 1rem;
  color: #238A8D;
  font-weight: 600;
}
#ocs-toolbar .goog-te-gadget-simple .goog-te-menu-value span { color: inherit !important; }
.goog-te-menu-frame { max-height: 300px !important; overflow-y: auto !important; }
</style>

<!-- Google Translate -->
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: 'en',
        includedLanguages: 'ar,zh-CN,zh-TW,fr,de,hi,id,it,ja,ko,pt,ru,es,sw,vi',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      },
      'google_translate_element'
    );
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<style>
/* Inline navbar search form */
#ocs-inline-search {
  margin-top: 8px;
  margin-bottom: 8px;
}
#ocs-inline-search .input-group {
  width: 220px;
}
#ocs-inline-search .form-control {
  border-radius: 20px 0 0 20px !important;
  height: 32px;
  font-size: 13px;
}
#ocs-inline-search .btn {
  background-color: #238A8D;
  color: white;
  border-color: #238A8D;
  border-radius: 0 20px 20px 0 !important;
  height: 32px;
  padding: 0 10px;
}
#ocs-inline-search .btn:hover {
  background-color: #1a6e70;
  border-color: #1a6e70;
}
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    /* ── Floating toolbar (translate) ── */
    var toolbar = document.createElement('div');
    toolbar.id = 'ocs-toolbar';

    var translateSlot = document.createElement('div');
    translateSlot.id = 'google_translate_element';
    toolbar.appendChild(translateSlot);

    document.body.appendChild(toolbar);

    /* ── Inline navbar search ── */
    var searchLink = document.querySelector('.navbar-nav a[href="site-search.html"]');
    var navbarCollapse = document.querySelector('.navbar-collapse');
    if (!searchLink || !navbarCollapse) return;

    // Replace placeholder text with the FA icon
    searchLink.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i>';
    searchLink.setAttribute('title', 'Search');

    // Build Bootstrap 3 navbar-form and append to navbar
    var form = document.createElement('form');
    form.id = 'ocs-inline-search';
    form.className = 'navbar-form navbar-right';
    form.setAttribute('role', 'search');
    form.style.display = 'none';
    form.innerHTML =
      '<div class="input-group">' +
        '<input id="ocs-search-q" type="text" class="form-control"' +
        '  placeholder="Search site\u2026" autocomplete="off">' +
        '<span class="input-group-btn">' +
          '<button class="btn" type="submit">' +
            '<i class="fa fa-search"></i>' +
          '</button>' +
        '</span>' +
      '</div>';
    navbarCollapse.appendChild(form);

    // Toggle form on search icon click
    searchLink.addEventListener('click', function (e) {
      e.preventDefault();
      var isOpen = form.style.display !== 'none';
      form.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) document.getElementById('ocs-search-q').focus();
    });

    // Submit → redirect to site-search.html with GCSE hash
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var q = document.getElementById('ocs-search-q').value.trim();
      if (q) window.location.href = 'site-search.html?q=' + encodeURIComponent(q);
    });

    // Close when clicking outside
    document.addEventListener('click', function (e) {
      if (!form.contains(e.target) && !searchLink.contains(e.target)) {
        form.style.display = 'none';
      }
    });
  });
</script>
